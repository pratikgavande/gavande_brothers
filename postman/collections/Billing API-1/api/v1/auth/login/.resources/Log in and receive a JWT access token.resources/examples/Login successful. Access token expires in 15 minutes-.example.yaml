$kind: http-example
name: Login successful. Access token expires in 15 minutes.
request:
  url: "{{baseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "admin@example.com",
        "password": "your-password"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "token_type": "Bearer",
        "expires_at": "2022-11-04T18:16:57.623Z",
        "user": {
          "id": 752,
          "full_name": "string",
          "email": "oTby4CJq@ApJLnHEHxD.tbmg",
          "role_id": 7591,
          "role": {
            "id": 4690,
            "name": "string",
            "code": "i6ss1wjq0e8q4jutjtkbkurls2y3pedrjnx117",
            "description": "string",
            "is_system": true,
            "created_at": "1989-12-17T00:12:14.039Z",
            "updated_at": "1949-03-16T14:07:28.133Z"
          },
          "is_active": true,
          "created_at": "1958-03-31T13:39:29.314Z",
          "updated_at": "1991-06-03T20:12:15.079Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "access_token": {
            "type": "string",
            "description": "HS256 signed JWT"
          },
          "token_type": {
            "type": "string",
            "enum": [
              "Bearer"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "user": {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64"
              },
              "full_name": {
                "type": "string"
              },
              "email": {
                "type": "string",
                "format": "email"
              },
              "role_id": {
                "type": "integer",
                "format": "int64"
              },
              "role": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "integer",
                    "format": "int64"
                  },
                  "name": {
                    "type": "string",
                    "maxLength": 100
                  },
                  "code": {
                    "type": "string",
                    "maxLength": 50,
                    "pattern": "^[a-z][a-z0-9_]{0,49}$"
                  },
                  "description": {
                    "type": "string",
                    "maxLength": 255
                  },
                  "is_system": {
                    "type": "boolean"
                  },
                  "created_at": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "updated_at": {
                    "type": "string",
                    "format": "date-time"
                  }
                },
                "required": [
                  "id",
                  "name",
                  "code",
                  "description",
                  "is_system",
                  "created_at",
                  "updated_at"
                ]
              },
              "is_active": {
                "type": "boolean"
              },
              "created_at": {
                "type": "string",
                "format": "date-time"
              },
              "updated_at": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "full_name",
              "email",
              "role_id",
              "role",
              "is_active",
              "created_at",
              "updated_at"
            ]
          }
        },
        "required": [
          "access_token",
          "token_type",
          "expires_at",
          "user"
        ]
      }
order: 1000
