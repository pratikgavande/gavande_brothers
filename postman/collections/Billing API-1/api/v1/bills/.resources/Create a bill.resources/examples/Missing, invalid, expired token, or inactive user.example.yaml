$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bills"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "bill_no": 1001,
        "customer_id": 1,
        "date": "2026-11-10T09:00:00+05:30",
        "gst_status": 1,
        "gst_amount": 0,
        "amount": 15000,
        "amount_received": 0,
        "amount_pending": 15000,
        "engineers_name": "Engineer Name",
        "site_name": "Site A",
        "location": "Pune",
        "item_count": 2,
        "status": 1
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 3000
