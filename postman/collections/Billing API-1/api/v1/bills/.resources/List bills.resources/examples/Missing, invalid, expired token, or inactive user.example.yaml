$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bills?page=1&limit=10&customerId=5178&date=1977-11-15&billNo=232"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number; defaults to 1.
    - key: limit
      value: "10"
      disabled: false
      description: Page size from 1 to 100; defaults to 10.
    - key: customerId
      value: "5178"
      disabled: false
      description: Filter by the existing customerId column.
    - key: date
      value: 1977-11-15
      disabled: false
      description: Match the bill's calendar date.
    - key: billNo
      value: "232"
      disabled: false
      description: Match the existing billNo value.
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 3000
