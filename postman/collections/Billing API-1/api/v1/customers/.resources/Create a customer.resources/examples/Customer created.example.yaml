$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/customers"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Gavande Bros",
        "mobile": "9876543210",
        "gst_no": "",
        "email": "",
        "address": "Pune, Maharashtra",
        "status": 1
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "string",
        "data": {
          "customer_id": 3327,
          "name": "string",
          "mobile": "string",
          "gst_no": "string",
          "email": "string",
          "address": "string",
          "status": -86
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "customer_id": {
                "type": "integer",
                "format": "int32"
              },
              "name": {
                "type": "string",
                "maxLength": 250
              },
              "mobile": {
                "type": "string",
                "maxLength": 250
              },
              "gst_no": {
                "type": "string",
                "maxLength": 250
              },
              "email": {
                "type": "string",
                "maxLength": 250
              },
              "address": {
                "type": "string"
              },
              "status": {
                "type": "integer",
                "minimum": -128,
                "maximum": 127,
                "format": "int32"
              }
            },
            "required": [
              "customer_id",
              "name",
              "mobile",
              "gst_no",
              "email",
              "address",
              "status"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
