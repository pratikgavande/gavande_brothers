$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/roles/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "8796"
      disabled: false
      description: Numeric role ID
  body:
    type: json
    content: |-
      {
        "name": "Billing Lead",
        "description": "Leads billing operations"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "role": {
          "id": 5793,
          "name": "string",
          "code": "edj2p3",
          "description": "string",
          "is_system": true,
          "created_at": "1965-06-21T23:43:02.000Z",
          "updated_at": "1953-11-28T20:31:00.286Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "role": {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64"
              },
              "name": {
                "type": "string",
                "maxLength": 100
              },
              "code": {
                "type": "string",
                "maxLength": 50,
                "pattern": "^[a-z][a-z0-9_]{0,49}$"
              },
              "description": {
                "type": "string",
                "maxLength": 255
              },
              "is_system": {
                "type": "boolean"
              },
              "created_at": {
                "type": "string",
                "format": "date-time"
              },
              "updated_at": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "name",
              "code",
              "description",
              "is_system",
              "created_at",
              "updated_at"
            ]
          }
        },
        "required": [
          "role"
        ]
      }
order: 1000
