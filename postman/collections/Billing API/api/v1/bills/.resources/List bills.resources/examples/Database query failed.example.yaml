$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bills?page=1&limit=10&customerId=289&date=1954-04-07&billNo=766"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number; defaults to 1.
    - key: limit
      value: "10"
      disabled: false
      description: Page size from 1 to 100; defaults to 10.
    - key: customerId
      value: "289"
      disabled: false
      description: Filter by the existing customerId column.
    - key: date
      value: 1954-04-07
      disabled: false
      description: Match the bill's calendar date.
    - key: billNo
      value: "766"
      disabled: false
      description: Match the existing billNo value.
  body:
    type: text
    content: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "success",
          "message"
        ]
      }
order: 4000
