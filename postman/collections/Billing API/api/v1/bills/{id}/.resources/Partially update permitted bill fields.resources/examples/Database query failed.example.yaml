$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bills/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "289"
      disabled: false
      description: Positive signed 32-bit database ID
  body:
    type: json
    content: |-
      {
        "date": "2026-11-10T09:00:00+05:30",
        "engineers_name": "Engineer Name",
        "site_name": "Site A"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "success",
          "message"
        ]
      }
order: 5000
