$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bills/:id/items"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "289"
      disabled: false
      description: Positive signed 32-bit database ID
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "name": "Installation",
            "rate": "5000",
            "unit": "service",
            "amount": 10000,
            "date": "2026-11-10",
            "status": 1
          },
          {
            "name": "Materials",
            "rate": "5000",
            "unit": "lot",
            "amount": 5000,
            "date": null,
            "status": 1
          }
        ]
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 3000
