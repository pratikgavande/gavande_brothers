$kind: http-request
description: |
  Inserts every submitted item in one database transaction. If an item
  insert fails, the entire batch is rolled back. bill_id is taken from
  the path and item_id is generated by the database. The nullable date
  field is accepted as text or null.
url: "{{baseUrl}}/api/v1/bills/:id/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "289"
    disabled: false
    description: Positive signed 32-bit database ID
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int32",
            "minimum": 1
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "items": [
        {
          "name": "Installation",
          "rate": "5000",
          "unit": "service",
          "amount": 10000,
          "date": "2026-11-10",
          "status": 1
        },
        {
          "name": "Materials",
          "rate": "5000",
          "unit": "lot",
          "amount": 5000,
          "date": null,
          "status": 1
        }
      ]
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "items": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": {
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 250
              },
              "rate": {
                "type": "string",
                "description": "Stored as TEXT; not parsed or recalculated."
              },
              "unit": {
                "type": "string",
                "description": "Stored as TEXT."
              },
              "amount": {
                "type": "integer",
                "format": "int32"
              },
              "date": {
                "type": "string",
                "description": "Optional nullable TEXT value; send a string or null."
              },
              "status": {
                "type": "integer",
                "minimum": -128,
                "maximum": 127,
                "format": "int32"
              }
            },
            "required": [
              "name",
              "rate",
              "unit",
              "amount",
              "status"
            ]
          }
        }
      },
      "required": [
        "items"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Add multiple items to a bill.resources/examples
order: 2000
