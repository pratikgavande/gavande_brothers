$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/customers?page=1&limit=10&search=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number; defaults to 1.
    - key: limit
      value: "10"
      disabled: false
      description: Page size from 1 to 100; defaults to 10.
    - key: search
      value: string
      disabled: false
      description: Partial match against name or mobile; matching case follows the MySQL column collation.
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 3000
